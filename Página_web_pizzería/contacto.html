<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Contacto - Pizzería</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="barra-superiorc">
  <div class="icono-pizza">🍕</div>
  <div class="texto-central">Habla con PizzaLú. El horno ya está encendido.</div>
  <div class="icono-pizza">🍕</div>
</div>


   <div class="contenedor-pizzita">
    <div class="pizzita"> 
      <img src="img/pizzita.png" alt="Pizza bebé">
    </div>

  <div class="contenedor-cont">
    <div class="encabezado-cont">
      <h1>Contacto</h1>
      <p>Contáctanos y déjanos hacer tu pizza perfecta.</p>
    </div>

    <form class="formulario" action="#" method="POST">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="nombre">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required>

      <label for="correo">Correo:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </div>
</div>

 <div class="cn-menu">
  <a href="menu.html" class="cn-boton">Haz tu pedido</a>
  <a href="quienesomos.html" class="cn-boton">¿Quiénes somos?</a>
  <a href="index.html" class="cn-boton2">Regresar al inicio</a>
</div>

</body>
</html>
